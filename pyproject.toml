[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[project]
name = "autostacgis"
version = "1.0.0"
description = "Native planning and streaming execution for STAC-described geospatial products"
requires-python = ">=3.12"
readme = "README.md"
license = "GPL-3.0-only"
dependencies = [
  "PyYAML>=6,<7", "jsonschema[format]>=4.23,<5", "referencing>=0.36,<1",
  "pystac-core>=1.15,<2", "click>=8,<9", "httpx>=0.28,<1", "wcmatch>=10,<12",
  "networkx>=3,<4",
  "jsonata-python>=0.7,<0.8", "numpy>=2,<3", "rasterio>=1.4,<2", "shapely>=2,<3", "pyproj>=3.7,<4",
  "pyarrow>=19,<27", "zarr>=3,<4", "numexpr>=2,<3", "threadpoolctl>=3,<4"
]
[project.optional-dependencies]
atmosphere = ["Py6S>=1.9,<2"]
spectralmatch = ["spectralmatch @ git+https://github.com/spectralmatch/spectralmatch.git@6c73cb2fe8a8d975e3233bb907e1a1caa4414b3d"]
registration = ["coregix>=0.3,<0.4", "opencv-python-headless>=4.10,<5"]
cloud = ["omnicloudmask>=1,<2"]
pointcloud = ["laspy[lazrs]>=2,<3"]
distributed = ["dask[distributed]>=2025"]
scheduler = ["APScheduler>=3.11,<4"]
s3 = ["boto3>=1.35,<2"]
telemetry = ["opentelemetry-sdk>=1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.12", "build>=1,<2"]
[project.scripts]
autostacgis = "autostacgis.cli:main"
[tool.hatch.metadata]
allow-direct-references = true
[tool.hatch.build.targets.wheel]
packages = ["autostacgis"]
[tool.hatch.build.targets.sdist]
include = ["/autostacgis", "/tests", "/examples", "/docs", "/tools", "/README.md", "/LICENSE", "/pyproject.toml", "/spec.lock.json", "/environment.yml", "/.gitmodules"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

