solver:
  backward_chain: {}
goal:
  metadata-value:
    kind: raster
    for_each: true
    select:
      kind: raster
      require:
        assets.$asset.data_state:spectral_sampling: multispectral
    jsonata: asset.`data_state:relative_radiometric_normalization` = true and asset.`data_state:pansharpened`
      = true
    value: true
metadata_in:
  stac-resolver: {}
process:
  pansharpen: {}
  global_radiometric_match:
    outputs:
      results:
        save: false
        encode:
          plugin: geotiff
        data_out:
          plugin: filesystem
        metadata_out:
          plugin: stac-json
