catalog:
  version: 0.0.1
  plugins:
  - use: stac-resolver
  - use: pansharpen
  - use: global_radiometric_match
    execution:
      outputs:
        result:
          save: true
          encode:
            plugin: geotiff
          data_out:
            plugin: filesystem
          metadata_out:
            plugin: stac-json
  - use: executor
  - use: events
  - use: geotiff
  - use: stac-json
request:
  sources:
  - stac-resolver
  goal:
    for_each:
      kind: raster
      select:
        assets.$asset.data_state:spectral_sampling: multispectral
      require:
        assets.$asset.data_state:relative_radiometric_normalization: true
        assets.$asset.data_state:pansharpened: true
