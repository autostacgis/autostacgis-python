solver:
  backward_chain: {}
goal:
  metadata-value:
    kind: raster
    for_each: true
    select:
      kind: raster
      require:
        assets.$asset.data_state:spectral_sampling: multispectral
    path: assets.$asset.data_state:pansharpened
    value: true
metadata_in:
  stac-resolver: {}
process:
  pansharpen:
    outputs:
      result:
        save: false
        encode:
          plugin: zarr
        data_out:
          plugin: filesystem
        metadata_out:
          plugin: stac-json
