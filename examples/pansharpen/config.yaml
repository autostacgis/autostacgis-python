catalog:
  version: 1.0.0
  plugins:
  - use: stac-resolver
  - use: pansharpen
  - use: executor
  - use: events
  - use: zarr
  - use: stac-json
request:
  sources:
  - stac-resolver
  goal:
    for_each:
      kind: raster
      select:
        assets.$asset.data_state:spectral_sampling: multispectral
      require:
        assets.$asset.data_state:pansharpened: true
      publish:
        encode:
          plugin: zarr
        data_out:
          plugin: filesystem
        metadata_out:
          plugin: stac-json
