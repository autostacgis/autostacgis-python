catalog:
  version: 1.0.0
  plugins:
  - use: stac-resolver
  - use: pansharpen
  - use: global_radiometric_match
  - use: group-by
  - use: executor
  - use: events
  - use: geotiff
  - use: stac-json
request:
  sources:
  - stac-resolver
  goal:
    for_each:
      kind: raster
      select:
        assets.$asset.data_state:spectral_sampling: multispectral
      require:
        assets.$asset.data_state:relative_radiometric_normalization: true
        assets.$asset.data_state:pansharpened: true
      publish:
        encode:
          plugin: geotiff
        data_out:
          plugin: filesystem
        metadata_out:
          plugin: stac-json
  sequence:
    global_radiometric_match.images:
      plugin: group-by
      settings:
        field: properties.platform
