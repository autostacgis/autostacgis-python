catalog:
  version: 0.0.1
  plugins:
  - use: stac-resolver
    settings:
      search_glob: data/*.tif
  - use: mosaic
    execution:
      outputs:
        result:
          save: true
          encode:
            plugin: geotiff
          data_out:
            plugin: filesystem
            settings:
              path: ./output/mosaic.tif
          metadata_out:
            plugin: stac-json
            settings:
              path: ./output/mosaic.stac.json
  - use: mask_by_polygons
  - use: markov_seamlines
  - use: clean_footprints
  - use: extract_footprints
  - use: align_grid
  - use: executor
  - use: events
  - use: geotiff
    settings: {}
  - use: stac-json
    settings:
      directory: output/stac
  - use: filesystem
    settings:
      directory: output/data
  - use: buffered-transfer
request:
  sources:
  - stac-resolver
  goal:
    all_of:
    - output:
        name: result
        coverage:
          geometry:
            type: Polygon
            coordinates:
            - - - -155.0
                - 19.0
              - - -155.0
                - 20.0
              - - -156.0
                - 20.0
              - - -156.0
                - 19.0
              - - -155.0
                - 19.0
          mode: footprint
        require:
          all:
          - assets.$asset.data_state:mosaic: true
          - {}
        kind: raster
    - output:
        name: result
        require:
          assets.$asset.cf:standard_name: surface_bidirectional_reflectance
          assets.$asset.unit: '1'
    - output:
        name: result
  steps:
    align_inputs:
      plugin: align_grid
      param:crs: EPSG:8857
      param:resolution: 2
      param:resampling: bilinear
    footprints:
      plugin: extract_footprints
      inputs:
        images: result:align_inputs:result
    clean_footprints:
      plugin: clean_footprints
      inputs:
        vector: result:footprints:result
    seamlines:
      plugin: markov_seamlines
      inputs:
        footprints: result:clean_footprints:result
        images: result:align_inputs:result
    mask_images:
      plugin: mask_by_polygons
      inputs:
        image: result:align_inputs:result
        mask: result:seamlines:result
    assemble_mosaic:
      plugin: mosaic
      inputs:
        images: result:mask_images:result
  data_transfer:
    plugin: buffered-transfer
    settings:
      memory_bytes: 268435456
  checkpoint: null
