solver:
  backward_chain: {}
goal:
  metadata-value:
    name: result
    coverage:
      geometry:
        type: Polygon
        coordinates:
        - - - -155.0
            - 19.0
          - - -155.0
            - 20.0
          - - -156.0
            - 20.0
          - - -156.0
            - 19.0
          - - -155.0
            - 19.0
      mode: footprint
    kind: raster
    jsonata: (((asset.`data_state:mosaic` = true) and true) and (asset.`cf:standard_name` = "surface_bidirectional_reflectance"
      and asset.`unit` = "1"))
    value: true
metadata_in:
  stac-resolver:
    search_glob: data/*.tif
process:
  mosaic:
    outputs:
      result:
        save: false
        encode:
          plugin: geotiff
        data_out:
          plugin: filesystem
          settings:
            path: ./output/mosaic.tif
        metadata_out:
          plugin: stac-json
          settings:
            path: ./output/mosaic.stac.json
  mask_by_polygons: {}
  markov_seamlines: {}
  clean_footprints: {}
  extract_footprints: {}
  align_grid: {}
services:
  executor: {}
  events: {}
encode:
  geotiff: {}
metadata_out:
  stac-json:
    directory: output/stac
data_out:
  filesystem:
    directory: output/data
data_transfer:
  buffered-transfer: {}
execution:
  sources:
  - stac-resolver
  steps:
    align_inputs:
      plugin: align_grid
      param:crs: EPSG:8857
      param:resolution: 2
      param:resampling: bilinear
    footprints:
      plugin: extract_footprints
      inputs:
        images: result:align_inputs:result
    clean_footprints:
      plugin: clean_footprints
      inputs:
        vector: result:footprints:result
    seamlines:
      plugin: markov_seamlines
      inputs:
        footprints: result:clean_footprints:result
        images: result:align_inputs:result
    mask_images:
      plugin: mask_by_polygons
      inputs:
        image: result:align_inputs:result
        mask: result:seamlines:result
    assemble_mosaic:
      plugin: mosaic
      inputs:
        images: result:mask_images:result
  data_transfer:
    plugin: buffered-transfer
    settings:
      memory_bytes: 268435456
  checkpoint: null
