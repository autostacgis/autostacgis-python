solver:
  backward_chain: {}
goal:
  metadata-value:
    name: result
    kind: raster
    jsonata: asset.`data_state:mosaic` = true and asset.`cf:standard_name` = "surface_bidirectional_reflectance"
      and asset.unit = "1"
    value: true
    coverage:
      geometry:
        type: Polygon
        coordinates:
        - - - -156
            - 19
          - - -155
            - 19
          - - -155
            - 20
          - - -156
            - 20
          - - -156
            - 19
      mode: footprint
metadata_in:
  stac-resolver: {}
process:
  extract_footprints: {}
  clean_footprints: {}
  markov_seamlines: {}
  mask_by_polygons: {}
  mosaic:
    outputs:
      result:
        save: false
        encode:
          plugin: geotiff
        data_out:
          plugin: filesystem
        metadata_out:
          plugin: stac-json
