catalog:
  version: 1.0.0
  plugins:
  - use: stac-resolver
  - use: extract_footprints
  - use: clean_footprints
  - use: markov_seamlines
  - use: mask_by_polygons
  - use: mosaic
  - use: executor
  - use: events
  - use: geotiff
  - use: stac-json
request:
  sources:
  - stac-resolver
  goal:
    all_of:
    - output:
        name: result
        kind: raster
        require:
          assets.$asset.data_state:mosaic: true
          assets.$asset.cf:standard_name: surface_bidirectional_reflectance
          assets.$asset.unit: '1'
        coverage:
          geometry:
            type: Polygon
            coordinates:
            - - - -155.0
                - 19.0
              - - -155.0
                - 20.0
              - - -156.0
                - 20.0
              - - -156.0
                - 19.0
              - - -155.0
                - 19.0
          mode: footprint
    - output:
        name: result
        publish:
          encode:
            plugin: geotiff
          data_out:
            plugin: filesystem
          metadata_out:
            plugin: stac-json
